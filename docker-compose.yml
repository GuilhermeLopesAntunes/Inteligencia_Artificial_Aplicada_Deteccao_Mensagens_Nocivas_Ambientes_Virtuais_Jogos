services:
  backend:
    build: ./backend
    container_name: artemis_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - MODEL_DIR=/models/modelo_tcc_final
      - DATABASE_URL=sqlite:////app/data/artemis.db
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./models:/models:ro
      - ./backend/data:/app/data
    restart: unless-stopped

  simulator:
    build: ./simulator
    container_name: artemis_simulator
    ports:
      - "3000:80"
    restart: unless-stopped

  scripts:
    build: ./scripts
    container_name: artemis_scripts
    profiles: ["training"]
    ports:
      - "8888:8888"
    volumes:
      - ./models:/models
      - ./scripts/datasets:/app/datasets
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
